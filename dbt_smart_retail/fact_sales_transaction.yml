version: 2

models:
  - name: fact_sales_transaction
    description: "One row per sales line item"
    columns:
      - name: transaction_id
        description: "Unique identifier for a sales transaction"
        tests:
          - not_null
          - unique
      - name: product_id
        description: "Product sold in the transaction"
        tests:
          - not_null
      - name: customer_id
        description: "Customer associated with the transaction"
        tests:
          - not_null
      - name: store_id
        description: "Store where the transaction occurred"
        tests:
          - not_null
