version: 2

models:
  - name: dim_customer
    description: "Clean customer profile with hashed email"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: loyalty_tier
        tests:
          - accepted_values:
              values: ['Gold', 'Silver', 'Bronze', 'NULL']

  - name: dim_product
    description: "Unified product catalogue"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_store
    description: "Store and region information"
    columns:
      - name: store_id
        tests:
          - not_null
          - unique

  - name: fact_sales_transaction
    description: "One row per sales line item"
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null

  - name: fact_inventory_snapshot
    description: "Daily stock position by product and location"
    columns:
      - name: product_id
        tests:
          - not_null
      - name: warehouse_id
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null